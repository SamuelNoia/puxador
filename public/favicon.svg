<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Puxador de Dados: macaco puxando a sigla SQL">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5597"/>
      <stop offset="1" stop-color="#16324F"/>
    </linearGradient>
    <linearGradient id="bloco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C948"/>
      <stop offset="1" stop-color="#E0A21A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>

  <!-- sombra de apoio -->
  <ellipse cx="176" cy="474" rx="112" ry="16" fill="#0B1D30" opacity="0.28"/>

  <!-- macaco -->
  <g>
    <!-- cauda -->
    <path d="M118 408 C 54 424, 46 360, 94 352" fill="none" stroke="#8B5E3C" stroke-width="14" stroke-linecap="round"/>
    <!-- pernas -->
    <rect x="132" y="424" width="31" height="48" rx="15.5" fill="#7A5133"/>
    <rect x="173" y="424" width="31" height="48" rx="15.5" fill="#7A5133"/>
    <!-- corpo -->
    <ellipse cx="168" cy="386" rx="65" ry="59" fill="#8B5E3C"/>
    <!-- braço de trás (puxando alto) -->
    <path d="M214 344 C 246 330, 272 320, 299 316" fill="none" stroke="#7A5133" stroke-width="19" stroke-linecap="round"/>
    <!-- braço da frente -->
    <path d="M210 372 C 244 372, 272 366, 296 360" fill="none" stroke="#9C6B45" stroke-width="20" stroke-linecap="round"/>
    <!-- mãos -->
    <circle cx="301" cy="315" r="13.5" fill="#C99A6B"/>
    <circle cx="298" cy="360" r="14" fill="#C99A6B"/>
    <!-- orelhas -->
    <circle cx="86" cy="262" r="27" fill="#8B5E3C"/>
    <circle cx="86" cy="262" r="14" fill="#C99A6B"/>
    <circle cx="234" cy="262" r="27" fill="#8B5E3C"/>
    <circle cx="234" cy="262" r="14" fill="#C99A6B"/>
    <!-- cabeça -->
    <circle cx="160" cy="258" r="84" fill="#8B5E3C"/>
    <!-- rosto -->
    <ellipse cx="160" cy="268" rx="61" ry="57" fill="#E3C3A0"/>
    <!-- sobrancelhas -->
    <path d="M118 226 q 20 -12 40 -2" fill="none" stroke="#5C3A22" stroke-width="6" stroke-linecap="round"/>
    <path d="M162 224 q 20 -10 40 2" fill="none" stroke="#5C3A22" stroke-width="6" stroke-linecap="round"/>
    <!-- olhos -->
    <circle cx="137" cy="247" r="10" fill="#2B1D14"/>
    <circle cx="183" cy="247" r="10" fill="#2B1D14"/>
    <circle cx="140" cy="243" r="3.4" fill="#FFFFFF"/>
    <circle cx="186" cy="243" r="3.4" fill="#FFFFFF"/>
    <!-- focinho -->
    <ellipse cx="160" cy="292" rx="31" ry="21" fill="#F2DEC8"/>
    <circle cx="150" cy="288" r="3.4" fill="#7A5133"/>
    <circle cx="170" cy="288" r="3.4" fill="#7A5133"/>
    <path d="M146 302 q 14 12 28 0" fill="none" stroke="#7A5133" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- corda esticada -->
  <path d="M312 338 C 330 344, 342 330, 354 314" fill="none" stroke="#F2D38A" stroke-width="8" stroke-linecap="round"/>

  <!-- bloco SQL sendo puxado -->
  <g transform="rotate(-10 410 292)">
    <rect x="342" y="240" width="138" height="100" rx="21" fill="url(#bloco)"/>
    <text x="411" y="309" text-anchor="middle"
          font-family="'Segoe UI Black','Arial Black','DejaVu Sans',sans-serif"
          font-size="53" font-weight="900" letter-spacing="1" fill="#16324F">SQL</text>
    <!-- riscos de movimento -->
    <path d="M488 252 h 15 M489 290 h 19 M488 328 h 13" stroke="#F2D38A" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
