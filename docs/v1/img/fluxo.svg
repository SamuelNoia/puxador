<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="220" fill="#f4f6fa"/>
  <g>
    <!-- banco -->
    <rect x="30" y="70" width="150" height="80" rx="10" fill="#fff" stroke="#d9e0ea"/>
    <text x="105" y="100" text-anchor="middle" font-size="13" fill="#1c2430" font-weight="600">Banco</text>
    <text x="105" y="118" text-anchor="middle" font-size="11" fill="#6b7788">MySQL · MariaDB</text>
    <text x="105" y="133" text-anchor="middle" font-size="11" fill="#6b7788">PostgreSQL · Firebird</text>

    <line x1="180" y1="110" x2="240" y2="110" stroke="#2f5597" stroke-width="2" marker-end="url(#seta)"/>

    <!-- telas -->
    <rect x="240" y="50" width="180" height="120" rx="10" fill="#fff" stroke="#d9e0ea"/>
    <text x="330" y="76" text-anchor="middle" font-size="13" fill="#1F4E78" font-weight="600">1 · Conexão</text>
    <text x="330" y="100" text-anchor="middle" font-size="11" fill="#6b7788">IP · porta · base</text>
    <text x="330" y="116" text-anchor="middle" font-size="11" fill="#6b7788">usuário · senha</text>
    <text x="330" y="140" text-anchor="middle" font-size="11" fill="#1c7c54">testar conexão</text>

    <line x1="420" y1="110" x2="480" y2="110" stroke="#2f5597" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="480" y="35" width="190" height="150" rx="10" fill="#fff" stroke="#d9e0ea"/>
    <text x="575" y="61" text-anchor="middle" font-size="13" fill="#1F4E78" font-weight="600">2 · Puxar dados</text>
    <text x="575" y="85" text-anchor="middle" font-size="11" fill="#6b7788">tabelas e colunas</text>
    <text x="575" y="103" text-anchor="middle" font-size="11" fill="#6b7788">renomear colunas</text>
    <text x="575" y="121" text-anchor="middle" font-size="11" fill="#6b7788">formatação</text>
    <text x="575" y="139" text-anchor="middle" font-size="11" fill="#6b7788">filtros · limite</text>

    <line x1="670" y1="110" x2="730" y2="110" stroke="#2f5597" stroke-width="2" marker-end="url(#seta)"/>

    <rect x="730" y="55" width="150" height="110" rx="10" fill="#fff" stroke="#d9e0ea"/>
    <text x="805" y="83" text-anchor="middle" font-size="13" fill="#1F4E78" font-weight="600">3 · Resultado</text>
    <text x="805" y="107" text-anchor="middle" font-size="11" fill="#6b7788">prévia</text>
    <text x="805" y="125" text-anchor="middle" font-size="11" fill="#6b7788">XLSX · CSV</text>
  </g>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#2f5597"/>
    </marker>
  </defs>
</svg>
